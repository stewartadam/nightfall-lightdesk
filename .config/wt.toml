[aliases]
done = "node {{ worktree_path }}/scripts/worktree-done.mjs {{ args }}"
service = "node {{ worktree_path }}/worktree-dashboard/worktree-service.mjs --worktree={{ worktree_path }} {{ args }}"

[[pre-start]]
setup-env = "node ./scripts/setup-env.mjs"

[[pre-start]]
install = "pnpm install"
typeshare = "pnpm run typeshare"

[[post-start]]
copy-target = "node ./scripts/seed-target-from-main.mjs"
copy-data-dir = "node ./scripts/seed-data-dir-from-main.mjs {{ args }}"
copy-assets = "cp -a {{ primary_worktree_path }}/webui/assets webui"

[[post-start]]
build = "cargo build --tests --bin nightfall-headless"
wasm-build = "pnpm run wasm-build:dev"

[pre-remove]
# Uses the primary checkout's script, so worktrees branched before it existed can still be removed.
stop-services = "node {{ repo_path }}/worktree-dashboard/worktree-service.mjs --worktree={{ worktree_path }} stop -s all"

# note: merge hooks are handled by prek
