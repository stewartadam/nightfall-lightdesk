[dependencies]
axum.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
base64.workspace = true
gdtf.workspace = true
notify.workspace = true
open-fixture-library = { path = "../open-fixture-library" }
quick-xml = "0.42"
nightfall = { path = "../common" }
nightfall-dmx = { path = "../dmx" }
nightfall-engine = { path = "../engine" }
nightfall-fixtures = { path = "../fixtures" }
