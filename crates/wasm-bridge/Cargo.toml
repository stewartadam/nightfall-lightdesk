[package]
license.workspace = true
name = "nightfall-wasm-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nightfall = { path = "../common" }
nightfall-cmd-parse = { path = "../cmd-parse" }
nightfall-io = { path = "../io" }
nightfall-lookahead-projection = { path = "../lookahead-projection" }
nightfall-selection = { path = "../selection" }
nightfall-waveform = { path = "../waveform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
uuid = { workspace = true, features = ["js"] }

[lints]
workspace = true
