[package]
name = "nightfall-service-host"
version.workspace = true
license.workspace = true
edition.workspace = true


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nightfall-workspace-hack = { version = "0.1", path = "../workspace-hack" }
spin_sleep = "1.3.3"
tracing.workspace = true

# gdt-cpus deliberately rejects Intel macOS; that target uses OS-default scheduling.
[target.'cfg(all(not(target_arch = "wasm32"), not(all(target_os = "macos", not(target_arch = "aarch64")))))'.dependencies]
gdt-cpus.workspace = true

[lints]
workspace = true
