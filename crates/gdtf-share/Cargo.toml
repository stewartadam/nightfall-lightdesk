[package]
name = "nightfall-gdtf-share"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
keyring-core = "1.0.1"
nightfall-websocket = { path = "../websocket" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
typeshare.workspace = true
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nightfall-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
