[package]
name = "app-tauri"
description = "Nightfall desktop shell"
version.workspace = true
license.workspace = true
edition.workspace = true
default-run = "nightfall-app"

[[bin]]
name = "nightfall-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-runtime = { path = "../app-runtime", default-features = false }
jiff.workspace = true
nightfall = { path = "../common" }
nightfall-config = { path = "../config" }
nightfall-desk = { path = "../desk", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# The shared tracing bridge handles plugin records without the plugin's tracing feature.
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
uuid.workspace = true

[features]
default = ["full", "beatgrid-detect"]
full = ["app-runtime/full"]
beatgrid-detect = ["app-runtime/beatgrid-detect"]

[lints]
workspace = true
