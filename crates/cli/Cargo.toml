[package]
name = "nightfall-cli"
description = "Standalone CLI binary for Nightfall that connects to engine via WebSocket"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "nightfall-cli"
path = "src/main.rs"

[dependencies]
futures-util.workspace = true
itertools = "0.15"
minicbor-serde.workspace = true
reedline = "0.52"
nightfall-cmd-parse = { path = "../cmd-parse" }
nightfall-config = { path = "../config" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-tungstenite = "0.30"
tracing-subscriber.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nightfall-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
