[package]
name = "nightfall-input-ltc"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
nightfall-engine = { path = "../engine" }
nightfall-timecode = { path = "../timecode" }
# Matches nightfall-audio so rodio keeps one feature set; only its cpal re-export is used.
rodio = { version = "0.23", default-features = false, features = ["wav", "mp3", "mp4", "playback", "tracing"] }
serde.workspace = true
tracing.workspace = true
typeshare.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nightfall-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
