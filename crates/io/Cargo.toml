[package]
name = "nightfall-io"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = ["plugin"]
# Derives the Bevy ECS traits (`Resource`, `Message`, `SystemSet`) on IO types.
# Consumers that only need the plain data types and constants, such as the WASM
# bridge, disable default features so Bevy stays out of their dependency tree.
ecs = ["dep:bevy_ecs"]
# The `IoPlugin`: transport settings and their command, the network interface feed and its
# loss alerts, and IO failure toasts.
plugin = ["ecs", "dep:bevy_app", "dep:nightfall-engine"]
# Refreshes the network interface list when the host reports a change.
native-network-watch = ["plugin", "dep:netwatcher"]

[dependencies]
bevy_app = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
netwatcher = { workspace = true, optional = true }
nightfall-engine = { path = "../engine", optional = true }
nightfall-dmx = { path = "../dmx" }
web-time.workspace = true
serde.workspace = true
tracing.workspace = true
typeshare.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nightfall-workspace-hack = { version = "0.1", path = "../workspace-hack" }
netdev.workspace = true

[dev-dependencies]
async-channel.workspace = true
minicbor-serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
