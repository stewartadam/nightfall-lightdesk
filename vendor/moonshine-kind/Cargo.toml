# Vendored from https://github.com/Zeenobit/moonshine_kind 0.5.1 and ported to Bevy 0.20 until an
# upstream release supports it. Dev-dependencies are dropped because its tests and examples are not built here.
[package]
name = "moonshine-kind"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "Simple type safety solution for Bevy"
categories = ["game-development"]
keywords = ["bevy", "ecs", "type-safety"]
readme = "README.md"
homepage = "https://github.com/Zeenobit/moonshine_kind"
repository = "https://github.com/Zeenobit/moonshine_kind"

[dependencies]
bevy_ecs = "0.20"
bevy_derive = "0.20"
bevy_reflect = "0.20"
bevy_utils = "0.20"
disqualified = "1"

