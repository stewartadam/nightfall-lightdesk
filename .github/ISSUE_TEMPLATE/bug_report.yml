name: Bug report
description: Report a reproducible problem in Nightfall.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Everything you submit, including the System Information filled in by Nightfall and any attachments, can be seen by anyone along with your GitHub username.

        Diagnostics, logs and showfiles may contain personal information such as usernames, file paths or object labels. Review them before attaching, or email them privately to [hello@nightfall.live](mailto:hello@nightfall.live). Private submissions are used only to look into the problem you reported and are deleted within 30 days after use. See the [privacy policy](https://nightfall.live/privacy) for details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence of actions that demonstrates the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nightfall version and operating system
      description: Find the version and build ID in About Nightfall.
    validations:
      required: true
  - type: textarea
    id: system-information
    attributes:
      label: System Information and examples
      description: Report a Bug in Nightfall can fill this field with System Information. Attach downloaded diagnostics, screenshots, and a minimal example showfile when useful.
