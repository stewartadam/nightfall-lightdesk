name: Shared release WASM

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      directory:
        type: string
        required: true

permissions: {}

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show
      - uses: $/.github/actions/rust-cache
        with:
          key: release-${{ inputs.package }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - uses: $/.github/actions/wasm-assets
        with:
          profile: release
          package: ${{ inputs.package }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ inputs.package }}-${{ github.sha }}
          path: webui/assets/${{ inputs.directory }}/
          if-no-files-found: error
          retention-days: 7
