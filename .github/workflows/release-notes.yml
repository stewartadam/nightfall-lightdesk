name: PR release notes

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  group: release-notes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Acquire PR description and validator source
    # Run standalone PRs and the lowest unmerged/top PRs of a stack.
    if: >-
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Acquire the merge-commit validator as data; execute it only on the next runner.
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - name: Snapshot the current PR description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir "$RUNNER_TEMP/pr-notes"
          test -d scripts && test ! -L scripts
          test -f scripts/release-notes.mjs && test ! -L scripts/release-notes.mjs
          cp scripts/release-notes.mjs "$RUNNER_TEMP/pr-notes/"
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-notes/pr.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-notes-${{ github.sha }}
          path: ${{ runner.temp }}/pr-notes/
          if-no-files-found: error
          retention-days: 7

  release-notes:
    name: Release notes
    needs: metadata
    if: ${{ !cancelled() && needs.metadata.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful metadata acquisition
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
        run: test "$METADATA_RESULT" = success
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pr-notes-${{ github.sha }}
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the current PR description
        run: node release-notes.mjs check --metadata .
