name: Desktop and browser artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/desktop-artifacts.yml'
      - '.github/workflows/browser-demo.yml'
      - '.gitignore'
      - 'webui/index.html'
      - 'webui/public/**'
      - 'scripts/*browser-demo*'
      - 'package.json'
      - 'crates/wasm-bridge/**'
      - 'crates/browser-runtime/**'
      - '.github/desktop-release-notes.md'
      - 'scripts/desktop-artifacts*'
      - 'scripts/*notices*'
      - 'config/notices/**'
      - 'about.toml'
      - 'Cargo.lock'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'crates/app/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Validate version and build shared web assets
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Load the repository Rust toolchain
        run: rustup show
      - name: Validate release policy
        id: release
        run: |
          node --test scripts/desktop-artifacts.node.test.mjs
          node scripts/desktop-artifacts.mjs prepare
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-web
          cache-on-failure: true
      - name: Install shared build tools
        run: |
          npm ci
          cargo install --locked typeshare-cli --version 1.13.3
          cargo install --locked cargo-about --version 0.8.4
          npm run typeshare
      - name: Check the reduced browser dependency graph
        run: npm run check:browser-demo-dependencies
      - name: Build release WASM once for both distributions
        run: npm run wasm-build
      - uses: actions/upload-artifact@v6
        with:
          name: release-wasm-${{ github.sha }}
          path: |
            webui/assets/wasm/
            webui/assets/browser-runtime/
          if-no-files-found: error
          retention-days: 7
      - name: Build shared desktop frontend
        run: |
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-web-${{ github.sha }}
          path: |
            webui/dist/
          if-no-files-found: error
          retention-days: 7

  browser-demo:
    needs: prepare
    # Version tags publish desktop installers; main and PRs also validate the demo.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/browser-demo.yml

  build:
    name: Package ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Load the repository Rust toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          cache-on-failure: true
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file wget
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: desktop-web-${{ github.sha }}
          path: webui/dist
      - name: Assemble target-specific distribution notices
        run: |
          cargo install --locked cargo-about --version 0.8.4
          node scripts/distribution-notices.mjs ${{ matrix.target }}
      - name: Validate macOS signing credentials
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "* ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
            exit 1
          fi
      - name: Build signed and notarized macOS installers
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        id: tauri-signed
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: crates/app
          tauriScript: npx tauri
          args: --ci --target ${{ matrix.target }} --bundles app,${{ matrix.bundles }} --config tauri.ci.conf.json -- --no-default-features --locked
      - name: Build credential-free desktop installers
        if: runner.os != 'macOS' || github.event_name == 'pull_request'
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: crates/app
          tauriScript: npx tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.ci.conf.json -- --no-default-features --locked
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        shell: bash
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          target_dir=$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)
          app="$target_dir/$DESKTOP_TARGET/release/bundle/macos/Nightfall.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Stage versioned installers
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-signed.outputs.artifactPaths || steps.tauri.outputs.artifactPaths }}
        run: node scripts/desktop-artifacts.mjs stage
      - name: Upload primary installer
        uses: actions/upload-artifact@v7
        with:
          path: desktop-artifacts/*${{ matrix.extensions[0] }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload additional installer
        if: matrix.extensions[1] != ''
        uses: actions/upload-artifact@v7
        with:
          path: desktop-artifacts/*${{ matrix.extensions[1] }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload target notices
        uses: actions/upload-artifact@v7
        with:
          path: desktop-artifacts/*-THIRD-PARTY-NOTICES.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish version-tag release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: nightfall-v${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Publish only after every installer has uploaded
        working-directory: release-assets
        shell: bash
        run: |
          sha256sum ./* > SHA256SUMS
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$state" != true ]; then
              echo "Release $RELEASE_TAG is already public; refusing to replace its assets."
              exit 1
            fi
          else
            prerelease_args=()
            if [ "$RELEASE_PRERELEASE" = true ]; then prerelease_args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Nightfall $RELEASE_VERSION" \
              --notes-file "$GITHUB_WORKSPACE/.github/desktop-release-notes.md" \
              "${prerelease_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
