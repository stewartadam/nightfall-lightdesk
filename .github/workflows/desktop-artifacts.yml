name: Unsigned desktop artifacts

on:
  workflow_call:

permissions: {}

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Validate version and build desktop frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Load the repository Rust toolchain
        run: rustup show
      - name: Validate release policy
        id: release
        run: |
          node --test scripts/desktop-artifacts.node.test.mjs
          node scripts/desktop-artifacts.mjs prepare
      - name: Download the published-release snapshot
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-releases-${{ github.sha }}
          path: release-metadata
      - name: Plan release-note metadata requests without credentials
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs plan --to "$RELEASE_TAG" \
            --metadata release-metadata --output "$RUNNER_TEMP/commits.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.release.outputs.publish == 'true'
        with:
          name: release-note-commits-${{ github.sha }}
          path: ${{ runner.temp }}/commits.json
          if-no-files-found: error
          retention-days: 7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-web
          cache-on-failure: true
      - name: Install shared build tools
        run: |
          npm ci
          cargo install --locked typeshare-cli --version 1.13.3
          cargo install --locked cargo-about --version 0.8.4
          npm run typeshare
      - name: Download shared release bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-wasm-bridge-${{ github.sha }}
          path: webui/assets/wasm
      - name: Build shared desktop frontend
        run: |
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-web-${{ github.sha }}
          path: |
            webui/dist/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Package ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        shell: bash
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Load the repository Rust toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-${{ matrix.target }}
          cache-on-failure: true
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file wget
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-web-${{ github.sha }}
          path: webui/dist
      - name: Assemble target-specific distribution notices
        run: |
          cargo install --locked cargo-about --version 0.8.4
          node scripts/distribution-notices.mjs ${{ matrix.target }}
      - name: Build credential-free desktop installers
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: crates/app
          tauriScript: npx tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.ci.conf.json -- --no-default-features --locked
      - name: Archive the macOS app for isolated signing
        if: runner.os == 'macOS' && needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          target_dir=$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/unsigned-macos.tar" \
            -C "$target_dir/$DESKTOP_TARGET/release/bundle/macos" Nightfall.app
      - name: Upload the unsigned app
        if: runner.os == 'macOS' && needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-macos-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-macos.tar
          if-no-files-found: error
          retention-days: 7
      - name: Stage versioned installers
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/desktop-artifacts.mjs stage
      - name: Upload primary installer
        # Release DMGs are uploaded only by the isolated signing job.
        if: runner.os != 'macOS' || needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: desktop-artifacts/*${{ matrix.extensions[0] }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload additional installer
        if: matrix.extensions[1] != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: desktop-artifacts/*${{ matrix.extensions[1] }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload target notice inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-notices-${{ matrix.target }}-${{ github.sha }}
          path: desktop-artifacts/notices-*.json
          if-no-files-found: error
          retention-days: 14

  notices:
    name: Combine desktop release notices
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-notices-*-${{ github.sha }}
          path: desktop-notices
          merge-multiple: true
      - run: node scripts/desktop-artifacts.mjs combine-notices
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: release-notices/THIRD-PARTY-NOTICES-v*.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

  release-note-metadata:
    name: Collect PR metadata without executing repository code
    needs: prepare
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-note-commits-${{ github.sha }}
          path: requests
      - name: Fetch only validated commit associations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jq -e 'type == "array" and all(.[]; type == "string" and test("^[a-f0-9]{40}$"))' requests/commits.json > /dev/null
          jq -r '.[]' requests/commits.json > "$RUNNER_TEMP/commits"
          mkdir -p release-metadata/commits
          while IFS= read -r sha; do
            gh api --paginate --slurp "repos/$GH_REPO/commits/$sha/pulls?per_page=100" \
              | jq 'add' > "release-metadata/commits/$sha.json"
          done < "$RUNNER_TEMP/commits"
          # Keep an artifact even when the release range contains no commits.
          cp requests/commits.json release-metadata/commits.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-note-metadata-${{ github.sha }}
          path: release-metadata/
          if-no-files-found: error
          retention-days: 90

  release-notes:
    name: Render release notes without credentials
    needs: release-note-metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-releases-${{ github.sha }}
          path: release-metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-note-metadata-${{ github.sha }}
          path: release-metadata
      - name: Collect release notes from included pull requests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs generate --to "$RELEASE_TAG" \
            --metadata release-metadata --output "$RUNNER_TEMP/release-notes.md"
      - name: Preserve release-note preview and source metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/release-notes.md.json
          if-no-files-found: error
          retention-days: 90
