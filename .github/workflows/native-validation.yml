name: Native validation

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      hook:
        type: string
        required: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      NEXTEST_PROFILE: ci
    steps:
      - name: Download credential-free source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      # selecting a toolchain either by action or manual `rustup` calls should happen
      # before the plugin, as the cache uses the current rustc version as its cache key
      - name: Show Rust toolchain
        run: rustup show

      - name: Cache native dependencies and tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Native stages produce different artifacts. Stable stage keys also let
          # develop pushes warm caches that PRs can restore from their base branch.
          shared-key: native-${{ inputs.stage }}-${{ hashFiles('Cargo.toml', 'scripts/run-native-cargo.mjs') }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Node dependencies
        run: npm clean-install

      - name: Install cargo-nextest for Rust tests
        if: inputs.stage == 'pre-push'
        # Prebuilt and checksum-verified; building it from source costs minutes on a cache miss.
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146

      - name: Run native ${{ inputs.stage }} hooks
        id: native-hooks
        run: npx prek run ${{ inputs.hook }} --all-files --verbose --show-diff-on-failure --color always --stage ${{ inputs.stage }}

      - name: Upload Rust test timings
        if: ${{ !cancelled() && inputs.stage == 'pre-push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-test-junit-${{ github.sha }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Stage the tested native backend
        if: inputs.stage == 'pre-push'
        run: |
          node scripts/run-native-cargo.mjs build --bin nightfall-headless
          target_dir=$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)
          mkdir -p ci-artifacts
          cp "$target_dir/debug/nightfall-headless" ci-artifacts/nightfall-headless
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.stage == 'pre-push'
        with:
          name: native-test-backend-${{ github.sha }}
          path: ci-artifacts/nightfall-headless
          if-no-files-found: error
          retention-days: 1

      # nextest cannot run doctests. Run them after the backend upload so browser
      # tests are not delayed, and even when nextest fails so both results report.
      - name: Run Rust doctests
        if: ${{ !cancelled() && inputs.stage == 'pre-push' && steps.native-hooks.outcome != 'skipped' }}
        run: npx prek run cargo-doctest --all-files --verbose --color always --stage pre-push
