name: CI (Prek Parity + WebUI Tests)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: Run prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # selecting a toolchain either by action or manual `rustup` calls should happen
      # before the plugin, as the cache uses the current rustc version as its cache key
      - name: Show Rust toolchain
        run: rustup show

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: |
          npm clean-install
          cargo install --locked typeshare-cli --version 1.13.3

      - name: Download beat detection model
        run: npm run download:beat-this-model

      - name: Generate TypeScript shared types
        run: npm run typeshare

      - name: Build WASM web assets (dev)
        id: wasm
        run: npm run wasm-build:dev

      - name: Run prek pre-commit stage hooks
        run: npx prek run --all-files --show-diff-on-failure --color always --stage pre-commit

      - name: Run prek pre-push stage hooks
        run: npx prek run --all-files --show-diff-on-failure --color always --stage pre-push

      # Keep smoke tests in this job to reuse Cargo and generated WASM assets.
      - name: Run Chromium product flows
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        uses: ./.github/actions/playwright-smoke
