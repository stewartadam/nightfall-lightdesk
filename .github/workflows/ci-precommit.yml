name: CI (Prek Parity + WebUI Tests)

on:
  pull_request:
  push:
    branches:
      - main
      - develop
    tags: ['v*']
  workflow_dispatch:
    inputs:
      distribution:
        description: Distributions to package
        type: choice
        default: all
        options: [all, desktop, browser]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  scope:
    name: Acquire source and select validation
    # Run standalone PRs and the lowest unmerged/top PRs of a stack.
    if: >-
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '2' }}
          lfs: true
          persist-credentials: false
      - name: Capture changed paths as data
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          : > .ci-changed-files
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only -z HEAD^1 HEAD > .ci-changed-files
          fi
      # This job never executes repository scripts, installs dependencies, or restores caches.
      - name: Archive credential-free source and Git history
        run: |
          if git config --local --get-regexp '(^credential\.|\.extraheader$)' > /dev/null; then
            echo '::error::Refusing to archive Git authentication configuration'
            exit 1
          fi
          tar --exclude='./.git/hooks' --exclude='./.git/lfs' \
            -cf "$RUNNER_TEMP/source.tar" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar
          if-no-files-found: error
          retention-days: 7
      - name: Snapshot published releases as data
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq 'add' > "$RUNNER_TEMP/releases.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: published-releases-${{ github.sha }}
          path: ${{ runner.temp }}/releases.json
          if-no-files-found: error
          retention-days: 7

  selection:
    name: Select distribution validation
    needs: scope
    runs-on: ubuntu-latest
    outputs:
      desktop_check: ${{ steps.select.outputs.desktop_check }}
      desktop_package: ${{ steps.select.outputs.desktop_package }}
      browser_package: ${{ steps.select.outputs.browser_package }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore credential-free source
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Test and select validation
        id: select
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          node --test scripts/ci-scope.node.test.mjs
          node scripts/ci-scope.mjs

  desktop-check:
    needs: [scope, selection]
    if: needs.selection.outputs.desktop_check == 'true'
    uses: ./.github/workflows/desktop-check.yml

  wasm-bridge:
    needs: scope
    uses: ./.github/workflows/wasm.yml
    with:
      package: wasm-bridge
      directory: wasm

  browser-runtime:
    needs: scope
    if: ${{ !startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/wasm.yml
    with:
      package: browser-runtime
      directory: browser-runtime

  desktop:
    needs: [scope, selection, wasm-bridge]
    if: needs.selection.outputs.desktop_package == 'true'
    uses: ./.github/workflows/desktop-artifacts.yml
    # Permission ceiling for the metadata-only job; all build/render jobs use {}.
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  browser-demo:
    needs: [scope, selection, wasm-bridge, browser-runtime]
    if: needs.selection.outputs.browser_package == 'true'
    uses: ./.github/workflows/browser-demo.yml

  source-checks:
    name: Source checks and script tests
    needs: scope
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # These hooks have dedicated jobs; all other pre-commit hooks run here.
      SKIP: cargo-clippy,npm-typecheck
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: source-tools
          cache-targets: false
      - run: npm ci
      - name: Run script tests
        run: npm run test:scripts
      - run: cargo install --locked typeshare-cli --version 1.13.3
      - name: Run source pre-commit hooks
        run: npx prek run --all-files --verbose --show-diff-on-failure --color always --stage pre-commit

  native:
    name: Rust Clippy
    needs: scope
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/native-validation.yml
    with:
      stage: pre-commit
      hook: cargo-clippy

  native-tests:
    name: Rust tests and backend
    needs: scope
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/native-validation.yml
    with:
      stage: pre-push
      hook: cargo-test

  webui:
    name: TypeScript and WebUI Node tests
    needs: [scope, wasm-bridge, browser-runtime]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: webui-tools
          cache-targets: false
      - name: Install dependencies
        run: |
          npm ci
          cargo install --locked typeshare-cli --version 1.13.3
          npm run typeshare
      - name: Download shared release bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-wasm-bridge-${{ github.sha }}
          path: webui/assets/wasm
      - name: Download shared release demo engine
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-browser-runtime-${{ github.sha }}
          path: webui/assets/browser-runtime
      - name: Run TypeScript pre-commit hook
        run: npx prek run npm-typecheck --all-files --show-diff-on-failure --color always --stage pre-commit
      - name: Run WebUI Node tests
        # Script tests run independently in source-checks.
        run: npm run test:webui-node

  browser-smoke:
    name: Chromium product flows
    needs: [scope, native-tests, wasm-bridge, browser-runtime]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: webui-tools
          cache-targets: false
      - name: Install dependencies
        run: |
          npm ci
          cargo install --locked typeshare-cli --version 1.13.3
          npm run typeshare
      - name: Download shared release bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-wasm-bridge-${{ github.sha }}
          path: webui/assets/wasm
      - name: Download shared release demo engine
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-browser-runtime-${{ github.sha }}
          path: webui/assets/browser-runtime
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Download the tested native backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-test-backend-${{ github.sha }}
          path: ci-artifacts
      - name: Run Chromium product flows
        env:
          NIGHTFALL_PLAYWRIGHT_BACKEND_EXECUTABLE: ${{ github.workspace }}/ci-artifacts/nightfall-headless
        uses: ./.github/actions/playwright-smoke

  precommit:
    # Keep the required check name stable while individual jobs report earlier.
    name: Run prek hooks
    needs: [scope, source-checks, native, native-tests, wasm-bridge, browser-runtime, webui, browser-smoke]
    if: ${{ !cancelled() && needs.scope.result != 'skipped' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
