name: Desktop compilation

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Native validation runs the Linux desktop tests alongside the runtime tests.
        runner: [macos-15, windows-2022]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        if: runner.os != 'Windows'
        shell: bash
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source
      - name: Restore Windows source and Git history
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          import pathlib
          import shutil
          import subprocess
          import tarfile

          # Match a Windows checkout with core.symlinks=false.
          with tarfile.open('.ci-source/source.tar') as archive:
              for member in archive:
                  if member.issym():
                      target = os.fsencode(member.linkname)
                      member.type = tarfile.REGTYPE
                      member.size = 0
                      member.linkname = ''
                      archive.extract(member, filter='data')
                      pathlib.Path(member.name).write_bytes(target)
                  else:
                      archive.extract(member, filter='data')
          subprocess.run(['git', 'config', 'core.symlinks', 'false'], check=True)
          shutil.rmtree('.ci-source')
      - name: Load the repository Rust toolchain
        run: rustup show
      - uses: ./.github/actions/rust-cache
        with:
          key: desktop-check
          cache-on-failure: true
      - name: Build and test the desktop application without creating installers
        env:
          # Tests do not embed the frontend or copy distribution resources.
          TAURI_CONFIG: '{"build":{"frontendDist":null},"bundle":{"resources":[]}}'
        run: cargo test -p app-tauri --all-targets --locked
