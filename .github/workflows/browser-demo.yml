name: Browser demo artifact

# Called after the distribution workflow uploads release WASM for this commit.
on:
  workflow_call:

permissions: {}

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Download credential-free source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-${{ github.sha }}
          path: .ci-source
      - name: Restore source and Git history
        run: tar -xf .ci-source/source.tar && rm -rf .ci-source

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Add the browser Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install JavaScript dependencies and browsers
        run: |
          npm clean-install
          cargo install --locked typeshare-cli --version 1.13.3
          cargo install --locked cargo-about --version 0.8.4
          npx playwright install --with-deps chromium firefox

      - name: Generate TypeScript shared types
        run: npm run typeshare

      - name: Download shared release WASM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-wasm-bridge-${{ github.sha }}
          path: webui/assets/wasm

      - name: Download shared demo engine
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-browser-runtime-${{ github.sha }}
          path: webui/assets/browser-runtime

      - name: Check the reduced browser dependency graph
        run: npm run check:browser-demo-dependencies

      - name: Test the browser runtime natively
        run: cargo test -p nightfall-browser-runtime

      - name: Test UI and release scripts
        run: npm test

      - name: Build and package the release artifact
        run: npm run build:browser-demo:prepared

      - name: Run the Chromium product flow
        run: npm run test:browser-demo-artifact -- --browser chromium

      - name: Run the Firefox product flow
        run: npm run test:browser-demo-artifact -- --browser firefox

      - name: Upload the immutable demo artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightfall-browser-demo-${{ github.sha }}
          path: webui/dist/
          if-no-files-found: error
