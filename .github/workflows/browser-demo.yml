name: Browser demo artifact

# Called after the distribution workflow uploads release WASM for this commit.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Add the browser Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install JavaScript dependencies and browsers
        run: |
          npm clean-install
          cargo install --locked typeshare-cli --version 1.13.3
          cargo install --locked cargo-about --version 0.8.4
          npx playwright install --with-deps chromium firefox

      - name: Generate TypeScript shared types
        run: npm run typeshare

      - name: Download shared release WASM
        uses: actions/download-artifact@v7
        with:
          name: release-wasm-${{ github.sha }}
          path: webui/assets

      - name: Check the reduced browser dependency graph
        run: npm run check:browser-demo-dependencies

      - name: Test the browser runtime natively
        run: cargo test -p nightfall-browser-runtime

      - name: Test UI and release scripts
        run: npm test

      - name: Build and package the release artifact
        run: npm run build:browser-demo:prepared

      - name: Run the Chromium product flow
        run: npm run test:browser-demo-artifact -- --browser chromium

      - name: Run the Firefox product flow
        run: npm run test:browser-demo-artifact -- --browser firefox

      - name: Upload the immutable demo artifact
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-browser-demo-${{ github.sha }}
          path: webui/dist/
          if-no-files-found: error
