name: Cargo tools
description: Install the pinned Cargo tools from prebuilt release binaries instead of compiling them.

inputs:
  typeshare:
    description: Install typeshare-cli, which generates the TypeScript shared types.
    required: false
    default: 'false'
  cargo-about:
    description: Install cargo-about, which collects Rust license notices for distributions.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Keep the versions in sync with CONTRIBUTING.md and scripts/distribution-notices.mjs.
    - name: Select pinned Cargo tools
      id: select
      shell: bash
      env:
        TYPESHARE: ${{ inputs.typeshare }}
        CARGO_ABOUT: ${{ inputs.cargo-about }}
      run: |
        tools=()
        [[ "$TYPESHARE" == true ]] && tools+=(typeshare-cli@1.13.3)
        [[ "$CARGO_ABOUT" == true ]] && tools+=(cargo-about@0.8.4)
        if [[ ${#tools[@]} -eq 0 ]]; then
          echo "::error::Select at least one Cargo tool to install"
          exit 1
        fi
        (IFS=,; echo "tools=${tools[*]}") >> "$GITHUB_OUTPUT"

    # `cargo install` compiled each tool from source, 1-3 minutes per tool and job.
    # install-action downloads cargo-about's release binary and uses cargo-binstall for
    # typeshare-cli, whose releases ship binaries for every hosted runner target.
    - name: Install pinned Cargo tools
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: ${{ steps.select.outputs.tools }}
