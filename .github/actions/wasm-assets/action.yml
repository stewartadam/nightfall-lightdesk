name: Cached WASM assets
description: Restore exact wasm-pack outputs or build and cache both WebAssembly packages.

inputs:
  profile:
    description: wasm-pack build profile (dev or release).
    required: true

runs:
  using: composite
  steps:
    - name: Identify the WASM compiler and profile
      id: compiler
      shell: bash
      env:
        WASM_PROFILE: ${{ inputs.profile }}
      run: |
        case "$WASM_PROFILE" in
          dev|release) ;;
          *) echo "Unsupported WASM profile: $WASM_PROFILE" >&2; exit 1 ;;
        esac
        echo "hash=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    # Final outputs must never use a fallback key: Cargo cannot check their freshness.
    # Hash whole crate trees to cover non-Rust build inputs as well as source files.
    - name: Restore generated WASM packages
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          webui/assets/wasm/
          webui/assets/browser-runtime/
        key: wasm-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain*', '.cargo/**', 'crates/**', 'config/**', 'test-fixtures/**', 'scripts/**', 'package.json', 'package-lock.json', 'LICENSE', '.github/workflows/**', '.github/actions/wasm-assets/**') }}

    - name: Build missing WASM packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        WASM_PROFILE: ${{ inputs.profile }}
      run: |
        if [[ "$WASM_PROFILE" == dev ]]; then
          npm run wasm-build:dev
        else
          npm run wasm-build
        fi

    - name: Verify generated package entry points
      shell: bash
      run: |
        for package in wasm/nightfall_wasm_bridge browser-runtime/nightfall_browser_runtime; do
          for suffix in .js .d.ts _bg.wasm; do
            test -s "webui/assets/${package}${suffix}"
          done
        done

    # Save immediately after a successful build, even if a later unrelated check fails.
    - name: Save generated WASM packages
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          webui/assets/wasm/
          webui/assets/browser-runtime/
        key: ${{ steps.cache.outputs.cache-primary-key }}
