name: Cached WASM assets
description: Restore exact wasm-pack outputs or build and cache one WebAssembly package.

inputs:
  profile:
    description: wasm-pack build profile (dev or release).
    required: true
  package:
    description: Rust package to build (wasm-bridge or browser-runtime).
    required: true

runs:
  using: composite
  steps:
    - name: Identify the WASM compiler and profile
      id: compiler
      shell: bash
      env:
        WASM_PROFILE: ${{ inputs.profile }}
        WASM_PACKAGE: ${{ inputs.package }}
      run: |
        case "$WASM_PROFILE" in
          dev|release) ;;
          *) echo "Unsupported WASM profile: $WASM_PROFILE" >&2; exit 1 ;;
        esac
        case "$WASM_PACKAGE" in
          wasm-bridge) directory=wasm; entry=nightfall_wasm_bridge ;;
          browser-runtime) directory=browser-runtime; entry=nightfall_browser_runtime ;;
          *) echo "Unsupported WASM package: $WASM_PACKAGE" >&2; exit 1 ;;
        esac
        echo "directory=$directory" >> "$GITHUB_OUTPUT"
        echo "entry=$entry" >> "$GITHUB_OUTPUT"
        echo "hash=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    # Final outputs must never use a fallback key: Cargo cannot check their freshness.
    # Hash whole crate trees to cover non-Rust build inputs as well as source files.
    - name: Restore generated WASM packages
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: webui/assets/${{ steps.compiler.outputs.directory }}/
        key: wasm-assets-v2-${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain*', '.cargo/**', 'crates/**', 'config/**', 'test-fixtures/**', 'scripts/**', 'package.json', 'package-lock.json', 'LICENSE', '.github/workflows/**', '.github/actions/wasm-assets/**') }}

    - name: Build missing WASM package
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        WASM_PROFILE: ${{ inputs.profile }}
        WASM_PACKAGE: ${{ inputs.package }}
        WASM_DIRECTORY: ${{ steps.compiler.outputs.directory }}
      run: |
        profile_args=()
        if [[ "$WASM_PROFILE" == dev ]]; then profile_args+=(--dev); fi
        npx wasm-pack build "${profile_args[@]}" --target web \
          --out-dir "../../webui/assets/$WASM_DIRECTORY" "crates/$WASM_PACKAGE"

    - name: Verify generated package entry points
      shell: bash
      env:
        WASM_DIRECTORY: ${{ steps.compiler.outputs.directory }}
        WASM_ENTRY: ${{ steps.compiler.outputs.entry }}
      run: |
        for suffix in .js .d.ts _bg.wasm; do
          test -s "webui/assets/$WASM_DIRECTORY/${WASM_ENTRY}${suffix}"
        done

    # Save immediately after a successful build, even if a later unrelated check fails.
    - name: Save generated WASM packages
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: webui/assets/${{ steps.compiler.outputs.directory }}/
        key: ${{ steps.cache.outputs.cache-primary-key }}
