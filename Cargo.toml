[workspace]
members = ["crates/*", "desktop/app-tauri"]
# Plain cargo commands select the runtime crates; the Tauri desktop shell builds only with -p app-tauri.
default-members = ["crates/*"]
exclude = ["vendor"]
resolver = "3" # default for rust 2024

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
artnet_protocol = "0.4"
async-channel = "2.5"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23"
bevy = { version = "0.20", default-features = false, features = ["debug"] }
bevy_app = { version = "0.20" }
bevy_diagnostic = { version = "0.20" }
bevy_ecs = { version = "0.20" }
bevy_platform = { version = "0.20" }
bevy_reflect = { version = "0.20" }
bevy_state = { version = "0.20" }
bevy_time = { version = "0.20" }
bimap = "0.6.3"
criterion = "0.8"
dashmap = { version = "6.2.1", features = ["serde"] }
dotenv = { package = "dotenv-ng", version = "1" }
enum_dispatch = "0.3.13"
futures-util = "0.3.34"
gdtf = "0.3.0"
jiff = "0.2.38"
minicbor = "2.3"
minicbor-serde = { version = "0.7", features = ["alloc"] }
mime_guess = { version = "2.0.5", default-features = false }
moonshine-kind = "0.5"
netdev = "0.46"
netwatcher = "0.8"
notify = "8.2"
orx-parallel = "4.1.1"
percent-encoding = "2.3.2"
partially = { version = "0.2.1", features = ["derive"] }
rosc = "0.11.4"
rustc-hash = "2.1.3"
sacn = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = { version = "3.24.0", features = ["json"] }
smart-default = "0.7.1"
socket2 = { version = "0.6.5", features = ["all"] }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53.2", features = ["sync", "rt-multi-thread", "macros"] }
tower-http = { version = "0.7.1", default-features = false }
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typeshare = "1.0.5"
uuid = { version = "1.27", features = ["serde", "v4", "v5"] }
web-time = { version = "1.1", features = ["serde"] }
wit-component = "0.261"

[patch.crates-io]
# Bevy 0.20 port of moonshine-kind 0.5.1 (upstream PR pending); drop once upstream publishes a Bevy 0.20 release.
moonshine-kind = { git = "https://github.com/stewartadam/moonshine_kind", rev = "067615a57073b8af310ef235a027dc11a64dcc7f" }

[profile.dev]
incremental = true            # Improve consecutive recompile performance
opt-level = 1                 # Enable a small amount of optimization in debug mode
# Keeps breakpoints, stepping and backtraces while skipping variable/type info, which roughly
# halves the macOS dSYMs that build caches such as kache materialize in every worktree.
debug = "line-tables-only"

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
debug = false
opt-level = 3
debug-assertions = false
overflow-checks = false
codegen-units = 16
incremental = false # for sccache

[profile.dev.package.nightfall-engine]
debug-assertions = true

[profile.dev.package.nightfall-desk]
debug-assertions = true

[profile.dev.package.tauri-utils]
# prevent IDE errors from generate_context macro
# see https://github.com/tauri-apps/tauri/issues/13865
debug-assertions = true

# -- START WORKAROUND --
# Keep debug assertions enabled for the Tauri/WebView stack in dev builds.
# This repo disables dependency debug assertions globally above, but Tauri/Wry
# gate web inspector support behind `debug_assertions`, so debug NSIS builds
# lose devtools unless these crates are opted back in explicitly.
[profile.dev.package.tauri]
debug-assertions = true

[profile.dev.package.tauri-runtime]
debug-assertions = true

[profile.dev.package.tauri-runtime-wry]
debug-assertions = true

[profile.dev.package.wry]
debug-assertions = true
# -- END WORKAROUND --

[profile.samply]
inherits = "dev"
debug = true

[workspace.lints.clippy]
collapsible_if = { level = "allow", priority = 0 }
