# Licenses accepted for redistributed Rust dependencies, in preference order.
# Keep build dependencies: native build scripts can embed third-party code.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0", "Unlicense", "0BSD", "CDLA-Permissive-2.0", "BlueOak-1.0.0"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
no-clearly-defined = true

# Cargo-about fetches omitted license files from the published crate’s Git commit.
# Checksums pin the reviewed text without storing duplicate license files.

