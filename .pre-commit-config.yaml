repos:
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8 # v1.5.6
  hooks:
    - id: insert-license
      name: MPL headers (source)
      files: \.(rs|[cm]?[jt]sx?|wit)$
      # Imported bevy_framepace code retains its upstream MIT license.
      exclude: ^crates/framepace/src/lib\.rs$
      args: [--license-filepath, config/license-headers/source.txt, --comment-style, '']
      stages: [pre-commit]
    - id: insert-license
      name: MPL headers (CSS)
      files: \.css$
      args: [--license-filepath, config/license-headers/css.txt, --comment-style, '']
      stages: [pre-commit]
    - id: insert-license
      name: MPL headers (HTML)
      files: \.html$
      args: [--license-filepath, config/license-headers/html.txt, --comment-style, '']
      stages: [pre-commit]
    - id: insert-license
      name: MPL headers (shell)
      files: \.sh$
      args: [--license-filepath, config/license-headers/shell.txt, --comment-style, '']
      stages: [pre-commit]

- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
  hooks:
    - id: actionlint
      files: ^\.github/workflows/[^/]+\.ya?ml$
      stages: [pre-commit]

- repo: local
  hooks:
    # code style and lints
    - id: biome-check
      name: biome check
      entry: pnpm exec biome check --files-ignore-unknown=true --no-errors-on-unmatched
      language: system
      pass_filenames: true
      types: [text]
      files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|css|svelte|vue|astro|graphql|gql)$"
      stages: [pre-commit]

    - id: typecheck
      name: TypeScript typecheck
      entry: pnpm run typecheck
      language: system
      pass_filenames: false
      files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts))$|(^|/)tsconfig(\\..+)?\\.json$"
      stages: [pre-commit]

    - id: rustfmt
      name: rustfmt
      description: Check if all files follow the rustfmt style
      entry: cargo fmt --all -- --check --color always
      language: system
      pass_filenames: false
      files: \.rs$
      stages: [pre-commit]

    - id: cargo-clippy
      name: Cargo clippy
      entry: cargo clippy --all-targets
      language: system
      pass_filenames: false
      files: \.rs$|(^|/)Cargo\.toml$
      stages: [pre-commit]

    - id: cargo-hakari
      name: Cargo workspace-hack
      description: Check the hakari workspace-hack matches the dependency graph and every crate uses it
      entry: bash -c 'cargo hakari generate --diff && cargo hakari manage-deps --dry-run'
      language: system
      pass_filenames: false
      files: (^|/)Cargo\.(toml|lock)$|^\.config/hakari\.toml$
      stages: [pre-commit]

    - id: typeshare
      name: typeshare
      description: Check if TypeScript definitions can be generated from Rust types
      entry: typeshare --lang typescript crates/ --output-file /dev/null
      language: system
      pass_filenames: false
      files: \.rs$
      stages: [pre-commit]

    - id: command-architecture
      name: command architecture
      entry: pnpm run check:command-architecture
      language: system
      pass_filenames: false
      files: ^(crates|desktop|webui)/.*\.(rs|tsx?)$|^scripts/check-command-architecture\.mjs$
      stages: [pre-commit]

    - id: crate-boundaries
      name: backend crate boundaries
      entry: pnpm run check:crate-boundaries
      language: system
      pass_filenames: false
      files: (^|/)Cargo\.toml$|^scripts/check-crate-boundaries\.mjs$|^config/architecture/(crate-boundary-exceptions|crate-roles)\.json$|^docs/backend-crate-boundaries\.md$
      stages: [pre-commit]

    # tests
    - id: cargo-nextest
      name: Rust tests
      entry: cargo nextest run --tests
      language: system
      pass_filenames: false
      files: \.rs$|(^|/)Cargo\.(toml|lock)$|^\.config/nextest\.toml$
      stages: [pre-push]

    # CI-only: rustdoc must process every library crate, which costs more per push
    # than the handful of doctests it runs. CI invokes the manual stage explicitly,
    # and contributors run `pnpm exec prek run cargo-doctest --stage manual`.
    - id: cargo-doctest
      name: Rust doctests
      entry: cargo test --doc
      language: system
      pass_filenames: false
      always_run: true
      stages: [manual]

    - id: node-tests
      name: Node tests
      entry: pnpm test
      language: system
      pass_filenames: false
      files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts))$|(^|/)tsconfig(\\..+)?\\.json$|^config/architecture/webui-boundary-exceptions\\.json$"
      stages: [pre-push]

    # post-merge and post-rewrite hooks cannot filter by filename - see j178/prek#2144
    - id: typeshare-after-git-update
      name: Run typeshare
      entry: pnpm run typeshare
      language: system
      stages: [post-merge, post-rewrite]
      always_run: true
      pass_filenames: false

    - id: wasm-build-after-git-update
      name: Build Wasm
      entry: pnpm run wasm-build:bridge:dev
      language: system
      stages: [post-merge, post-rewrite]
      always_run: true
      pass_filenames: false
