<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824px body centred in a 1024px canvas, as in Apple's app icon template. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0B1020" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(25.75)">
    <rect x="8" y="8" width="3" height="16" rx="1.5" fill="#E6E8FF"/>
    <rect x="14.5" y="8" width="3" height="16" rx="1.5" fill="#E6E8FF"/>
    <rect x="21" y="8" width="3" height="16" rx="1.5" fill="#E6E8FF"/>
    <rect x="6.8" y="13" width="5.4" height="4" rx="2" fill="#7C5CFF"/>
    <rect x="13.3" y="10.5" width="5.4" height="4" rx="2" fill="#31D0AA"/>
    <rect x="19.8" y="16.5" width="5.4" height="4" rx="2" fill="#FFB020"/>
  </g>
</svg>
