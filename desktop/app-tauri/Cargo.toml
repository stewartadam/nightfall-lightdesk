[package]
name = "app-tauri"
description = "Nightfall desktop shell"
version.workspace = true
license.workspace = true
edition.workspace = true
default-run = "nightfall-app"

[[bin]]
name = "nightfall-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-runtime = { path = "../../crates/app-runtime", default-features = false }
jiff.workspace = true
nightfall = { path = "../../crates/common" }
nightfall-config = { path = "../../crates/config" }
nightfall-desk = { path = "../../crates/desk", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# The shared tracing bridge handles plugin records without the plugin's tracing feature.
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nightfall-workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[features]
default = ["full", "beat-detection"]
full = ["app-runtime/full"]
beat-detection = ["app-runtime/beat-detection"]

[lints]
workspace = true
